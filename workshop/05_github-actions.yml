run-name: Run Integration Tests

on: [push]
jobs:
  Build_Solution:
    runs-on: [self-hosted, dotnet]
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: dotnet restore ShoppingApp.slnx
      - name: Build_Solution
        run: dotnet build ShoppingApp.slnx --configuration Release --no-restore
      - name: Run Integration Tests
        run: > 
          dotnet test test/ShoppingApp.Tests --no-restore --verbosity normal --logger trx 
          --results-directory "IntegrationTestsResults"
      - name: Run FSharp Integration Tests
        run: >
          dotnet test test/ShoppingApp.Tests.FSharp --no-restore --verbosity normal --logger trx
          --results-directory "IntegrationTestsResults"
      - uses: actions/upload-artifact@v3
        with:
          name: Integration Tests Results
          path: IntegrationTestsResults